; Matrice LED 9x10 pilotée par ESP32
;
; Compiler + flasher le firmware : pio run -t upload
; Envoyer l'interface web (data/) : pio run -t uploadfs
; Moniteur série                  : pio device monitor

[env:esp32dev]
; Versions avec lesquelles le projet a été compilé : plateforme 8.0.0 (Arduino core 3.3.12), FastLED 3.10.9, WebSockets 2.7.3
platform = espressif32 @ ^8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; La page web (dossier data/) est stockée en LittleFS
board_build.filesystem = littlefs

lib_deps =
    fastled/FastLED @ ~3.10.9
    links2004/WebSockets @ ^2.7.3

; --- Mise à jour par WiFi (OTA) -------------------------------------------
; Une fois le premier flash fait par USB, tu peux décommenter ces lignes pour
; mettre à jour la carte sans câble (firmware ET uploadfs).
upload_protocol = espota
upload_port = esp32.local
upload_flags = --auth=ota
